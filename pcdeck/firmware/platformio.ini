; PC-Deck Firmware
; ------------------------------------------------------------
; Eine Env pro Deck. Die Pins stehen als build_flags hier drin,
; damit du sie anpassen kannst, ohne den Code anzufassen.
;
;   pio run -e deck_s3_ts35   -t upload     (ESP32-S3 + MKS TS35 V2.0)
;   pio run -e deck_esp32_tft35 -t upload   (klassischer ESP32 + BTT TFT35 SPI V2.1)
;
; Deck 1 (deck_s3_ts35): Belegung festgelegt (bestehende Verdrahtung des TS35).
; Deck 2 (deck_esp32_tft35): !!! PINS NOCH AN DIE VERDRAHTUNG ANPASSEN !!!
; ------------------------------------------------------------

[env]
platform = espressif32
framework = arduino
lib_deps = lovyan03/LovyanGFX@^1.2.0
board_build.filesystem = littlefs
monitor_speed = 921600
build_flags =
  -DSERIAL_BAUD=921600

; ------------------------------------------------------------
; Deck 1: ESP32-S3 + MKS TS35 V2.0 (ST7796 + XPT2046, 480x320)
; ------------------------------------------------------------
[env:deck_s3_ts35]
board = esp32-s3-devkitc-1
; ESP32-S3 N16R8: 8 MB Octal-PSRAM einschalten (dort wird die ganze Seite flimmerfrei
; vorgezeichnet). Die PSRAM-Pins GPIO 35-37 nutzt die Verdrahtung nicht.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  ; 1 = "Serial" ist der native USB-Port des S3 (Buchse "USB").
  ; 0 = "Serial" ist der UART-Port (Buchse "COM"/"UART" mit CH340/CH343).
  ; Festgelegt: Deck hängt an der Buchse "USB" -> 1.
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Belegung neu verdrahtet 22.10.2026 (Gehäuse): Steuerleitungen am Antennen-Ende (J1-4..8),
  ; SCLK/MOSI/MISO bleiben auf den IOMUX-Pins von SPI2 (FSPI) für volle SPI-Leistung.
  ; Touch teilt den Bus. Frei für den Drehgeber: GPIO 1, 2, 42 (J3-4..6).
  -DPIN_SCLK=12
  -DPIN_MOSI=11
  -DPIN_MISO=13
  -DPIN_TFT_CS=5
  -DPIN_TFT_DC=4
  -DPIN_TFT_RST=7
  ; -1 wenn die Hintergrundbeleuchtung fest an 3,3 V/5 V hängt
  -DPIN_TFT_BL=15
  -DPIN_TOUCH_CS=6
  ; 1 setzen, wenn die Farben invertiert aussehen
  -DTFT_INVERT=0
  ; 1 setzen, wenn Rot und Blau vertauscht sind
  -DTFT_BGR=0
  -DTFT_SPI_FREQ=40000000
  ; Display im Gehäuse um 180° gedreht eingebaut (1 = normal quer, 3 = gedreht)
  -DTFT_ROTATION=3
  ; Drehgeber EC11 (ab FW 10): A blau, B lila, Taster weiß, gemeinsam schwarz an GND
  -DPIN_ENC_A=1
  -DPIN_ENC_B=2
  -DPIN_ENC_SW=42
  ; Drehrichtung am Deck 1 umgekehrt (rechts drehen = +)
  -DENC_REVERSE=1

; ------------------------------------------------------------
; Deck 2: klassischer ESP32 + BTT TFT35 SPI V2.1 (ST7796 + Touch, 480x320)
; ------------------------------------------------------------
[env:deck_esp32_tft35]
board = esp32dev
; ESP32-D0WD-V3, 4 MB Flash, CH340 (COM11). Ab FW 16: 2 x 1,5 MB Programm (Update aus der App) + 960 KB LittleFS.
board_build.partitions = partitions_deck2.csv
build_flags =
  ${env.build_flags}
  ; BTT TFT35 SPI V2.1 (XH2.54: IORQ SCL SDA RS NSS SCK MOSI MISO GND +5V), verdrahtet 23.10.2026:
  ; Display ILI9488 über SPI (VSPI = IOMUX-Pins 18/19/23/5, volle Geschwindigkeit),
  ; Touch NS2009 über I2C; kein Reset- und kein Licht-Anschluss (Licht immer an).
  -DTFT_ILI9488
  -DTOUCH_NS2009
  -DTFT_SPI_HOST=SPI3_HOST
  -DPIN_SCLK=18
  -DPIN_MOSI=23
  -DPIN_MISO=19
  -DPIN_TFT_CS=5
  -DPIN_TFT_DC=27
  -DPIN_TFT_RST=-1
  -DPIN_TFT_BL=-1
  -DPIN_TOUCH_SDA=21
  -DPIN_TOUCH_SCL=22
  -DPIN_TOUCH_INT=35
  -DTFT_INVERT=0
  -DTFT_BGR=0
  -DTFT_SPI_FREQ=40000000
  ; ILI9488 von BTT steht gekippt: gespiegelte Drehung (LovyanGFX 4-7)
  -DTFT_ROTATION=5
  ; Drehgeber EC11: A, B, Taster gegen GND (interne Pull-ups)
  -DPIN_ENC_A=25
  -DPIN_ENC_B=26
  -DPIN_ENC_SW=33

; Falls das zweite Deck auch einen ESP32-S3 bekommt: einfach die
; Env deck_s3_ts35 kopieren, umbenennen und die Pins anpassen.
